[book]
title = "Spindle-Rust"
authors = ["anuna"]
description = "A Rust implementation of the SPINdle defeasible logic reasoning engine"
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
git-repository-url = "https://git.anuna.io/anuna-research/spindle-rust"
git-repository-icon = "fa-code-fork"
edit-url-template = "https://git.anuna.io/anuna-research/spindle-rust/src/branch/main/docs/{path}"

additional-js = ["src/spl-highlight.js"]

[output.html.fold]
enable = true
level = 1
