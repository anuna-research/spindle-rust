name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/src/**'
      - 'docs/book.toml'
      - 'docs/theme/**'
      - 'CHANGELOG.md'
      - '.forgejo/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/src/**'
      - 'docs/book.toml'
      - 'docs/theme/**'
      - 'CHANGELOG.md'
      - '.forgejo/workflows/docs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -fsSL --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.4.51/mdbook-v0.4.51-x86_64-unknown-linux-gnu.tar.gz -o /tmp/mdbook.tar.gz
          tar -xzf /tmp/mdbook.tar.gz -C /usr/local/bin mdbook

      - name: Build book
        run: mdbook build docs

      # spindle-docs serves https://spindle-rust.anuna.io.
      # PRs build the book without receiving deployment credentials.
      - name: Deploy production documentation
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Actions secret CF_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Actions secret CF_ACCOUNT_ID'; exit 1; }
          npx --yes wrangler@4.90.1 pages deploy docs/book --project-name=spindle-docs --branch=main --commit-dirty=true
