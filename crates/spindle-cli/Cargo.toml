[package]
name = "spindle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for spindle defeasible logic reasoning"

[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
spindle-core = { path = "../spindle-core", features = ["serde"] }
spindle-parser = { path = "../spindle-parser" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.10"
regex = "1.10"
jsonschema = "0.17"
serde_json = "1.0"
