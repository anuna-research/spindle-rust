when:
  - event: [push, pull_request]

steps:
  - name: check
    image: rust:1.88-bookworm
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all -- --check
      - cargo clippy --all -- -D warnings

  - name: contract-error-envelope
    image: rust:1.88-bookworm
    commands:
      - cargo test --package spindle-contract --test error_quality_tests
      - cargo test --package spindle-cli --test contract_matrix_tests
      - cargo test --package spindle-cli --test error_rendering_tests
      - cargo test --package spindle-cli --test contract_guard_tests

  - name: contract-reason-json
    image: rust:1.88-bookworm
    commands:
      - cargo test --package spindle-cli --test reason_json_contract_tests

  - name: contract-wasm
    image: rust:1.88-bookworm
    commands:
      - cargo test --package spindle-wasm --test wasm_contract
      - cargo test --package spindle-contract --test parity

  - name: test
    image: rust:1.88-bookworm
    commands:
      # Contract tests already run in dedicated gate steps above;
      # exclude fully-covered crates to reduce redundant work.
      - cargo test --workspace --exclude spindle-contract --exclude spindle-wasm

  - name: wasm
    image: rust:1.88-bookworm
    commands:
      - rustup target add wasm32-unknown-unknown
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - cd crates/spindle-wasm && wasm-pack build --target web --release

  - name: lean-oracle
    image: rust:1.88-bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git clang lld libc6-dev libgmp-dev
      - curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
      - export PATH="$HOME/.elan/bin:$PATH"
      # Elaborate all verification libraries (default targets) AND build the
      # oracle executables the conformance difftests spawn. Building the exes
      # explicitly is required: the sdl/family/parser/trust difftests skip
      # (and pass green) when their binary is missing, so a bare `lake build`
      # would leave them silently unverified.
      # The verifier also fails admitted proofs (`sorry`/`admit`) and any
      # AxiomAudit dependency outside Lean's standard axiom whitelist.
      - scripts/check-lean-verification.sh
      # Full conformance suite: every difftest that pins the Rust engine to the
      # verified Lean model, not just the arith/grounding/end-to-end subset.
      - cargo test --package spindle-core --test lean_end_to_end_difftest -- --ignored
      - cargo test --package spindle-core --test lean_arith_oracle_difftest -- --ignored
      - cargo test --package spindle-core --test lean_grounding_oracle_difftest -- --ignored
      - cargo test --package spindle-core --test lean_sdl_exhaustive_difftest -- --ignored
      - cargo test --package spindle-core --test lean_family_exhaustive_difftest -- --ignored
      - cargo test --package spindle-core --test lean_trust_oracle_difftest -- --ignored
      - cargo test --package spindle-core --test spl_parser_difftest -- --ignored
    # Conformance compares the RUST engine against the Lean model, so it must
    # run when EITHER side changes — not just on lean/** edits. The parser
    # crate is included because spl_parser_difftest pins the Rust parser to the
    # Lean parser oracle; a PR touching only spindle-parser must not skip it.
    when:
      - path:
          [
            "lean/**",
            "crates/spindle-core/**",
            "crates/spindle-parser/**",
          ]

  - name: deploy-docs
    image: node:22-bookworm
    when:
      - event: push
        branch: main
        path: "docs/**"
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cf_api_token
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      - curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.51/mdbook-v0.4.51-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - mdbook build docs
      - npx wrangler pages deploy docs/book --project-name=spindle-docs --commit-dirty=true
