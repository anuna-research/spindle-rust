when:
  - event: tag
    branch: main

steps:
  - name: build-executables
    image: rust:1.88-bookworm
    commands:
      # Install system dependencies for cross-compilation
      - apt-get update && apt-get install -y zip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # Add cross-compilation targets
      - rustup target add aarch64-unknown-linux-gnu
      - rustup target add wasm32-unknown-unknown

      - mkdir -p dist

      # Build for Linux x86_64 (native)
      - echo "Building for Linux x86_64..."
      - cargo build --release --package spindle-cli
      - cp target/release/spindle dist/spindle-linux-x86_64
      - cd dist && tar -czvf spindle-linux-x86_64.tar.gz spindle-linux-x86_64 && cd ..

      # Build for Linux aarch64 (cross-compile)
      - echo "Building for Linux aarch64..."
      - |
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        cargo build --release --package spindle-cli --target aarch64-unknown-linux-gnu
        cp target/aarch64-unknown-linux-gnu/release/spindle dist/spindle-linux-aarch64
        cd dist && tar -czvf spindle-linux-aarch64.tar.gz spindle-linux-aarch64 && cd ..

      # Build WASM package
      - echo "Building WASM package..."
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - cd crates/spindle-wasm && wasm-pack build --target web --release && cd ../..
      - cd crates/spindle-wasm/pkg && tar -czvf ../../../dist/spindle-wasm.tar.gz . && cd ../../..

      # Create version.json
      - |
        cat > dist/version.json << EOF
        {
          "version": "${CI_COMMIT_TAG#v}",
          "download_url": "https://files.anuna.io/spindle/${CI_COMMIT_TAG}"
        }
        EOF

      # Create install script
      - |
        cat > dist/install.sh << 'INSTALL_EOF'
        #!/bin/bash
        set -e

        # Spindle Installer
        TOOL_NAME="spindle"
        VERSION="$${VERSION:-latest}"
        BASE_URL="https://files.anuna.io/spindle"
        INSTALL_DIR="$${INSTALL_DIR:-$$HOME/.local/bin}"

        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m'

        info() { echo -e "$${GREEN}[INFO]$${NC} $$1"; }
        warn() { echo -e "$${YELLOW}[WARN]$${NC} $$1"; }
        error() { echo -e "$${RED}[ERROR]$${NC} $$1"; exit 1; }

        detect_platform() {
          local detected_os detected_arch
          detected_os="$(uname -s 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          detected_arch="$(uname -m 2>/dev/null)"

          case "$detected_os" in
            linux*)  OS="linux" ;;
            darwin*) OS="macos" ;;
            *)       error "Unsupported OS: $detected_os" ;;
          esac

          case "$detected_arch" in
            x86_64|amd64)  ARCH="x86_64" ;;
            arm64|aarch64) ARCH="aarch64" ;;
            *)             error "Unsupported architecture: $detected_arch" ;;
          esac

          PLATFORM="$${OS}-$${ARCH}"
          info "Detected platform: $$PLATFORM"
        }

        get_version() {
          if [[ "$VERSION" == "latest" ]]; then
            info "Fetching latest version..."
            VERSION=$(curl -fsSL "$BASE_URL/latest/version.json" 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            if [[ -z "$VERSION" ]]; then
              error "Could not determine latest version"
            fi
            info "Latest version: $VERSION"
          fi
        }

        install_binary() {
          info "Installing $TOOL_NAME v$VERSION for $PLATFORM..."

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          ARCHIVE_NAME="spindle-$${OS}-$${ARCH}.tar.gz"
          DOWNLOAD_URL="$BASE_URL/v$VERSION/$ARCHIVE_NAME"
          ARCHIVE_FILE="$TMP_DIR/$ARCHIVE_NAME"

          info "Downloading from $DOWNLOAD_URL..."
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "$DOWNLOAD_URL" -o "$ARCHIVE_FILE" || error "Download failed. Binary may not be available for $$PLATFORM."
          elif command -v wget >/dev/null 2>&1; then
            wget -q "$DOWNLOAD_URL" -O "$ARCHIVE_FILE" || error "Download failed. Binary may not be available for $$PLATFORM."
          else
            error "curl or wget is required"
          fi

          info "Extracting archive..."
          tar -xzf "$ARCHIVE_FILE" -C "$TMP_DIR"

          mkdir -p "$INSTALL_DIR"
          cp "$TMP_DIR/spindle-$${OS}-$${ARCH}" "$INSTALL_DIR/$TOOL_NAME"
          chmod +x "$INSTALL_DIR/$TOOL_NAME"
          info "Binary installed to $INSTALL_DIR/$TOOL_NAME"

          if [[ ":$PATH:" != *":$INSTALL_DIR:"* ]]; then
            warn "$INSTALL_DIR is not in your PATH"
            echo "Add it to your shell profile:"
            echo "  echo 'export PATH=\"\$PATH:$INSTALL_DIR\"' >> ~/.bashrc"
          fi
        }

        main() {
          echo "================================"
          echo "  Spindle Installer"
          echo "================================"
          echo ""

          detect_platform
          get_version
          install_binary

          echo ""
          info "Installation complete!"
          echo ""
          echo "Quick start:"
          echo "  spindle --help"
          echo "  spindle reason examples/penguin.dfl"
          echo ""
          echo "Documentation: https://codeberg.org/anuna/spindle-rust"
        }

        main "$$@"
        INSTALL_EOF
        chmod +x dist/install.sh

      # Create release notes
      - |
        cat > release-notes.md << EOF
        ## Release ${CI_COMMIT_TAG}

        Defeasible logic reasoning engine.

        ### Quick Install

        \`\`\`bash
        curl -fsSL https://files.anuna.io/spindle/latest/install.sh | bash
        \`\`\`

        ### Manual Installation

        Download the binary for your platform and place it in your PATH.

        #### Linux x86_64
        \`\`\`bash
        tar -xzf spindle-linux-x86_64.tar.gz
        sudo cp spindle-linux-x86_64 /usr/local/bin/spindle
        \`\`\`

        #### Linux aarch64
        \`\`\`bash
        tar -xzf spindle-linux-aarch64.tar.gz
        sudo cp spindle-linux-aarch64 /usr/local/bin/spindle
        \`\`\`

        ### WASM

        The WASM package is also available for use in browsers and JavaScript runtimes.

        ### Usage

        \`\`\`bash
        # Reason over a theory
        spindle reason theory.dfl

        # JSON output
        spindle reason theory.dfl --json

        # Show help
        spindle --help
        \`\`\`
        EOF

      # List built artifacts
      - ls -la dist/

  - name: upload-to-cloudflare-r2
    image: amazon/aws-cli:2.15.0
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cf_r2_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cf_r2_secret_access_key
      CF_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      # Configure AWS CLI for Cloudflare R2
      - export AWS_DEFAULT_REGION=auto
      - export R2_ENDPOINT="https://$${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - export BUCKET="anuna-files"
      - export PROJECT="spindle"

      # Upload versioned release
      - echo "Uploading to $${PROJECT}/$${CI_COMMIT_TAG}/..."
      - |
        for file in dist/spindle-*.tar.gz dist/version.json dist/install.sh; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded: $$filename"
          fi
        done

      # Upload to latest/
      - echo "Uploading to $${PROJECT}/latest/..."
      - |
        for file in dist/spindle-*.tar.gz dist/version.json dist/install.sh; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/latest/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded to latest: $$filename"
          fi
        done

      # List uploaded files
      - echo "Files in $${PROJECT}/$${CI_COMMIT_TAG}:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/" --endpoint-url "$$R2_ENDPOINT"
      - echo "Files in $${PROJECT}/latest:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/latest/" --endpoint-url "$$R2_ENDPOINT"
      - echo ""
      - echo "Release available at:"
      - echo "  https://files.anuna.io/$${PROJECT}/$${CI_COMMIT_TAG}/"
      - echo "  https://files.anuna.io/$${PROJECT}/latest/"
