name: Differential Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rust-tests:
    name: Rust proptest differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run proptest differential tests (500 cases)
        run: cargo test --package spindle-core --test difftest
        env:
          PROPTEST_CASES: 500

      - name: Run full test suite
        run: cargo test --workspace

  lean-oracle:
    name: Lean oracle differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://elan-init.github.io/elan/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.elan
          key: ${{ runner.os }}-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}

      - name: Build Lean oracle
        working-directory: lean
        run: lake build

      - name: Run Lean oracle tests
        run: cargo test --package spindle-core --test lean_oracle_difftest -- --ignored

      - name: Verify Lean proofs compile (sorry warnings OK)
        working-directory: lean
        run: lake build 2>&1 | tee build.log && ! grep "error:" build.log
