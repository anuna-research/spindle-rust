[workspace]
resolver = "2"
members = [
    "crates/spindle-core",
    "crates/spindle-parser",
    "crates/spindle-contract",
    "crates/spindle-cli",
    "crates/spindle-wasm",
    "crates/spindle-zk",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Hugo O'Connor", "David Factor", "Spindle Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://codeberg.org/anuna/spindle-rust"
description = "Defeasible logic reasoning engine - Rust port of SPINdle"
keywords = ["defeasible-logic", "reasoning", "non-monotonic", "logic"]
categories = ["science", "algorithms"]

[workspace.dependencies]
# Core dependencies
thiserror = "2"
derive_more = { version = "1", features = ["display", "from"] }

# Parser dependencies
nom = "8"
logos = "0.14"

# CLI dependencies
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = "0.4"

# Numeric
rust_decimal = "1"

# Collections
indexmap = "2"
rustc-hash = "2"
fixedbitset = "0.5"
smallvec = "1.13"

# Testing
pretty_assertions = "1"

# Optional zero-knowledge module; ordinary engine crates do not depend on these.
halo2_proofs = "=0.3.5"
halo2_gadgets = "=0.5.0"
ff = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
